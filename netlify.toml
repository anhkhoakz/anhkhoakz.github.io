[build]
command = "hugo --gc --minify --enableGitInfo"
publish = "public"

[build.environment]
# Replace with the exact output version from: hugo version
HUGO_VERSION = "0.163.0"
HUGO_ENV = "production"
HUGO_ENABLEGITINFO = "true"
TZ = "Asia/Singapore"

[context.production.environment]
HUGO_ENV = "production"

[context.deploy-preview]
command = "hugo --gc --minify --buildDrafts --buildFuture --baseURL $DEPLOY_PRIME_URL"

[context.branch-deploy]
command = "hugo --gc --minify --baseURL $DEPLOY_PRIME_URL"

# ─────────────────────────────────────────────────────────────
# Global security + privacy headers
# ─────────────────────────────────────────────────────────────

[[headers]]
for = "/*"

[headers.values]
Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
Content-Security-Policy = "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'none'; frame-src 'none'; img-src 'self' data:; manifest-src 'self'; media-src 'self'; object-src 'none'; script-src 'self'; style-src 'self'; worker-src 'self'; upgrade-insecure-requests"
X-Content-Type-Options = "nosniff"
X-Frame-Options = "DENY"
Referrer-Policy = "no-referrer"
Permissions-Policy = "accelerometer=(), ambient-light-sensor=(), autoplay=(), bluetooth=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), gamepad=(), geolocation=(), gyroscope=(), hid=(), identity-credentials-get=(), idle-detection=(), local-fonts=(), magnetometer=(), microphone=(), midi=(), otp-credentials=(), payment=(), picture-in-picture=(), publickey-credentials-create=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), speaker-selection=(), storage-access=(), usb=(), web-share=(self), xr-spatial-tracking=()"
Cross-Origin-Opener-Policy = "same-origin"
Cross-Origin-Resource-Policy = "same-origin"
X-DNS-Prefetch-Control = "off"

# ─────────────────────────────────────────────────────────────
# Aggressive browser cache for fingerprinted static assets
# Only safe when filenames change after content changes.
# ─────────────────────────────────────────────────────────────

[[headers]]
for = "/assets/*"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/css/*"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/js/*"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/images/*"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/img/*"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/fonts/*"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/media/*"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/favicon.ico"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*.webmanifest"

[headers.values]
Cache-Control = "public, max-age=86400, must-revalidate"

# ─────────────────────────────────────────────────────────────
# SEO files: cache, but revalidate quickly
# ─────────────────────────────────────────────────────────────

[[headers]]
for = "/robots.txt"

[headers.values]
Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
for = "/sitemap.xml"

[headers.values]
Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
for = "/index.xml"

[headers.values]
Cache-Control = "public, max-age=3600, must-revalidate"

# ─────────────────────────────────────────────────────────────
# Hide source maps in production
# ─────────────────────────────────────────────────────────────

[[redirects]]
from = "/js/*.map"
to = "/404.html"
status = 404
force = true

[[redirects]]
from = "/css/*.map"
to = "/404.html"
status = 404
force = true
